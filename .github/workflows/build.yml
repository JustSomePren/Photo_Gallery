name: Build APK

on:
  push:
  workflow_dispatch:

# Two builds at once would fight over the release
concurrency: build-apk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Podpisový klíč ze secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Chybí secret SIGNING_KEY (viz README, Podpisový klíč)"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/klic.p12"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/klic.p12" >> "$GITHUB_ENV"
      - run: ./gradlew testDebugUnitTest assembleRelease
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      # A fixed download link for the phone, no ZIP: releases/download/nejnovejsi/galerie.apk
      - name: APK ke stažení
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk galerie.apk
          gh release delete nejnovejsi --yes --cleanup-tag || true
          gh release create nejnovejsi galerie.apk --title "Galerie – nejnovější verze" --target "$GITHUB_SHA" \
            --notes "Sestaveno z větve $GITHUB_REF_NAME, commit ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obrazovky
          path: app/build/outputs/roborazzi/
